[package]
name = "fflit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
doi = "0.2"
hex = "0.4"
lopdf = "0.33"
nom-bibtex = "0.5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
tantivy = "0.22"
thiserror = "1"
walkdir = "2"
